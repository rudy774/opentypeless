name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@3c71ce730280171fd1cfb57c00c774f8998586f7 # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue!

            We'll take a look as soon as possible. In the meantime:
            - Make sure you've filled out the template completely
            - Check [existing issues](https://github.com/rudy774/opentypeless/issues) for duplicates
            - Use this repository's [Discussions](https://github.com/rudy774/opentypeless/discussions) for questions or ideas
          pr-message: |
            Thanks for your first pull request!

            A maintainer will review it soon. While you wait:
            - Make sure CI checks pass
            - Check the [contributing guide](https://github.com/rudy774/opentypeless/blob/main/CONTRIBUTING.md)
            - Use this repository's [Discussions](https://github.com/rudy774/opentypeless/discussions) for follow-up questions
